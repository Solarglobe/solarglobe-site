# Configuration Netlify - SolarGlobe
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Construction du dossier public uniquement
  publish = "dist"
  command = "npm run build"

# Pretty URLs : activer dans Netlify UI si besoin
# Project configuration > Build & deploy > Post processing > Pretty URLs

# Redirections — netlify.toml override les règles UI
# Force /qui-sommes-nous/ à servir la page (priorité sur toute règle UI)
[[redirects]]
  from = "/qui-sommes-nous/"
  to = "/qui-sommes-nous/index.html"
  status = 200
  force = true
