# Exemple de configuration NGINX pour redirections SolarGlobe
# Structure : dossiers avec index.html

# Redirections permanentes (301)
location = /etude-solaire-gratuite.html { return 301 /etude-gratuite/; }
location = /qui-sommes-nous.html { return 301 /notre-methode/; }
location = /faq.html { return 301 /faq/; }
location = /blog.html { return 301 /blog/; }
location = /contact.html { return 301 /contact/; }
location = /produits.html { return 301 /produits/; }
location = /seo/etude-solaire-gratuite.html { return 301 /etude-gratuite/; }

# URLs propres -> dossiers/index.html (structure standard)
location = /faq { return 301 /faq/; }
location = /faq/ { try_files $uri $uri/ /faq/index.html =404; }
location = /blog { return 301 /blog/; }
location = /blog/ { try_files $uri $uri/ /blog/index.html =404; }
location = /contact { return 301 /contact/; }
location = /contact/ { try_files $uri $uri/ /contact/index.html =404; }
location = /produits { return 301 /produits/; }
location = /produits/ { try_files $uri $uri/ /produits/index.html =404; }
location = /etude-gratuite { return 301 /etude-gratuite/; }
location = /etude-gratuite/ { try_files $uri $uri/ /etude-gratuite/index.html =404; }
